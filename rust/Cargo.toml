[package]
name = "sansreplace"
version = "0.1.0"
edition = "2024"
default-run = "sansreplace"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
csv = "1.1"
anyhow = "1.0.68"

[dependencies.clap]
version = "4.0.32"
features = ["derive"]

# Exact uniformity requires unbiased bounded draws. Apply the same range
# reduction policy to every algorithm in new comparisons.
[dependencies.rand]
version = "0.10.3"
features = ["unbiased"]
